<!doctype html>
<html lang="es" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0a0e1a" />
  <meta name="description" content="Control financiero personal mensual — gestiona ingresos, gastos, presupuesto y deudas desde tu navegador." />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icons/icon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <title>Control Financiero — Tu dinero bajo control</title>
</head>
<body>
  <div id="app">
    <!-- Sidebar (Desktop/Tablet) -->
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="brand-icon">₱</div>
        <div>
          <div class="brand-title">Control Financiero</div>
          <div class="brand-sub">Mensual · Personal</div>
        </div>
      </div>
      <nav id="nav" class="nav"></nav>
      <div class="sidebar-footer">
        <button id="installBtn" class="secondary-btn hidden">⬇ Instalar app</button>
        <button id="backupBtn" class="secondary-btn">📦 Exportar respaldo</button>
        <label class="secondary-btn file-btn">📥 Importar respaldo<input id="importInput" type="file" accept="application/json" hidden></label>
      </div>
    </aside>

    <!-- Main Content -->
    <main class="main">
      <header class="topbar">
        <div>
          <h1 id="pageTitle">Dashboard</h1>
          <div id="pageSubtitle" class="muted">Tu panorama financiero</div>
        </div>
        <div class="top-actions">
          <label class="month-picker">
            <span>Mes</span>
            <input id="monthInput" type="month">
          </label>
          <button id="themeToggle" class="theme-toggle" title="Cambiar tema">🌙</button>
          <button id="quickAddBtn" class="primary-btn">+ Movimiento</button>
        </div>
      </header>
      <section id="content"></section>
    </main>
  </div>

  <!-- Bottom Navigation (Mobile) -->
  <nav id="bottomNav" class="bottom-nav"></nav>

  <!-- Modal Root -->
  <div id="modalRoot"></div>

  <!-- Toast -->
  <div id="toast" class="toast"></div>

  <script src="app.js"></script>
</body>
</html>
